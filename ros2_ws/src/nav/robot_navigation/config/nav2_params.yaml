# Nav2 parameters for the DASE7503 mecanum logistics robot (Nav2 1.3, ROS 2 Jazzy).
# SI units throughout. Frames: map -> odom -> base_link.
# Loaded with ParameterFile(allow_substs=True): launch substitutions are
# expanded in the whole file, comments included, so never write the
# substitution syntax in a comment.
#
# Command velocity chain:
#   controller_server / behavior_server -> /cmd_vel_nav
#   -> velocity_smoother -> /cmd_vel (geometry_msgs/Twist) -> ESP32

# ---------------------------------------------------------------- localisation

map_server:
  ros__parameters:
    yaml_filename: $(find-pkg-share robot_navigation)/maps/field_map.yaml
    topic_name: map
    frame_id: map

amcl:
  ros__parameters:
    robot_model_type: "nav2_amcl::OmniMotionModel"
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan_filtered
    tf_broadcast: true
    transform_tolerance: 0.5

    # Initial pose; x, y, yaw are overridden by the launch arguments
    # initial_x, initial_y, initial_yaw.
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # Particle filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    # Small field and slow robot: update the filter often
    update_min_d: 0.05
    update_min_a: 0.1
    save_pose_rate: 0.5

    # Odometry noise (alpha5: lateral translation noise, used by the omni model)
    # TODO: tune with real wheel odometry
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Laser model
    laser_model_type: "likelihood_field"
    laser_max_range: -1.0   # -1: use range_max of the scan
    laser_min_range: -1.0   # -1: use range_min of the scan
    laser_likelihood_max_dist: 1.0
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

# ------------------------------------------------------------------ navigation

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    transform_tolerance: 0.1
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Default behaviour trees of nav2_bt_navigator are used.
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    odom_topic: /odometry/filtered
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    # Holonomic: y must not be filtered out (Nav2 default 0.5 is for diff drive)
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    use_realtime_priority: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.05   # TODO: tune for rack pickup accuracy
      yaw_goal_tolerance: 0.10

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Omni"
      # Reduced from the Nav2 defaults (2000 x 56) for the Raspberry Pi 5.
      # Horizon = time_steps * model_dt = 2.0 s (0.8 m at vx_max).
      batch_size: 1000
      time_steps: 40
      model_dt: 0.05
      iteration_count: 1
      # Velocity limits, same as the EC interface and velocity_smoother
      vx_max: 0.4
      vx_min: -0.4
      vy_max: 0.3
      wz_max: 1.5
      # Acceleration limits, same as velocity_smoother. TODO: measure on the robot
      ax_max: 1.0
      ax_min: -1.0
      ay_max: 1.0
      ay_min: -1.0
      az_max: 3.0
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      temperature: 0.3
      gamma: 0.015
      prune_distance: 1.0
      transform_tolerance: 0.1
      regenerate_noises: true
      # Publishes /optimal_trajectory (local path) and /trajectories for RViz.
      # Set to false on the robot if CPU time is short.
      visualize: true
      TrajectoryVisualizer:
        trajectory_step: 20
        time_step: 4
      # PreferForwardCritic and PathAngleCritic are left out: the robot is
      # holonomic and may drive sideways. TwirlingCritic suppresses needless
      # rotation while translating.
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
        "PathAlignCritic", "PathFollowCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        # true: must match the polygon footprint of the costmaps. The full
        # footprint is only checked when the centre cost is above the
        # circumscribed cost, which needs inflation_radius (0.25) larger than
        # the circumscribed radius (~0.21 incl. padding).
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0

# Planner choice: SmacPlanner2D rather than NavFn.
# - Cost-aware A* (cost_travel_multiplier) keeps paths away from walls and racks
#   in the narrow field, and its built-in smoother gives cleaner paths for MPPI.
# - No kinematic constraints are needed (holonomic base), so a 2D grid search
#   is enough; Hybrid-A* / State Lattice would be wasted CPU.
# - The field is only ~3.5 x 2.4 m incl. margin (~21k cells at 0.02 m), so
#   planning time on the Pi is negligible either way.
# Note: Nav2 Jazzy SmacPlanner2D always logs "Inflation layer either not found
# or inflation is not set sufficiently ..." at configure. It passes a fixed 0.0
# cost to its collision checker; the 2D search only checks the centre cell, so
# the message is harmless and not related to inflation_radius.
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.05
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false          # everything outside the walls is unknown
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 1.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.0

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # [vx, vy, wz], same as MPPI limits
    max_velocity: [0.4, 0.3, 1.5]
    min_velocity: [-0.4, -0.3, -1.5]
    max_accel: [1.0, 1.0, 3.0]
    max_decel: [-1.0, -1.0, -3.0]
    deadband_velocity: [0.0, 0.0, 0.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    velocity_timeout: 1.0

# -------------------------------------------------------------------- costmaps
# Resolution 0.02 m for both costmaps:
# - matches the static map (maps/field_map.yaml), so no resampling,
# - gaps around racks are only a few cm wider than the robot; 0.05 m cells
#   would round them away,
# - the field is small (~21k cells), so the CPU cost on the Pi is low.
#
# Footprint: chassis 0.28 x 0.28 m.
# TODO: switch to the rack footprint while carrying a rack.

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.02
      footprint: "[[0.14, 0.14], [0.14, -0.14], [-0.14, -0.14], [-0.14, 0.14]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      # Narrow field: small radius, steep decay so the robot still fits
      # between racks but keeps some clearance where there is room.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
        cost_scaling_factor: 10.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      resolution: 0.02
      track_unknown_space: true
      footprint: "[[0.14, 0.14], [0.14, -0.14], [-0.14, -0.14], [-0.14, 0.14]]"
      footprint_padding: 0.01
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
        cost_scaling_factor: 10.0
      always_send_full_costmap: true
