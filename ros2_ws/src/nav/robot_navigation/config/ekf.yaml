# robot_localization EKF: fuses wheel odometry and IMU yaw rate.
# This node is the only publisher of odom -> base_link.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odometry from the ESP32 (no TF published there).
    # Config order: x, y, z, roll, pitch, yaw,
    #               vx, vy, vz, vroll, vpitch, vyaw,
    #               ax, ay, az
    odom0: /odom/wheel
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # IMU: only the yaw rate is used (data_raw has no orientation)
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: false
